[package]
name = "railway-santinvoice"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
color-eyre = "0.6.5"
dotenvy = "0.15.7"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "rustls-tls", "smtp-transport"] }
quick-xml = "0.42.0"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "form", "http2", "json", "multipart", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.0", features = ["v4"] }
